# One rule decides between `[[inn]]` and `[[left_out]]`: an innkeeper is listed when the data settles the
# name: a capital (it binds to the city's name), or a town with no inn or tavern sub-area of its own in
# AreaTable (it binds to the town's name). It is left out, with the candidates in its `reason`, when
# the town has an inn or tavern sub-area, when the data gives no town at the spawn, when the data does not
# tell two places apart, when the camp has no AreaTable row, or when its one candidate is a name taken
# only from the map overlay at the spawn or from a map of its own (Dalaran, Farholde Keep, Elderwild,
# Theramore Isle), which no AreaTable sub-area backs and nobody has checked against what the bind says.
# Their bind steps carry neither `inn` nor `ia`, and the addon falls back to the marks and the bind's
# position. Move one to an `[[inn]]` once its name is checked in game.

