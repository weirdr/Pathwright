# The place each innkeeper binds the hearthstone to: the English name `GetBindLocation()` says after
# binding with him (the subzone he stands in, else the town). The game data has no sub-area for a
# spawn (only its zone) nor an overlay for a tavern, so the places are listed by hand. Read by the
# guide writer (`World::inn_place`) and by `addon/tools/guide_build.py`, which look the name up in
# AreaTable to give a bind step its `inn` and the AreaTable ids `ia` (to match it on another
# language's client). An innkeeper not listed gets neither: the addon then falls back to its marks
# and to the binding's position.

# Left out on purpose: the `[[left_out]]` entries at the end (`guide_build.py` reads them too), among
# them the WoW Forever camps' innkeepers, whose camps have no AreaTable row to name.
# `scripts/check-inns.py` fails on an innkeeper of the game data in neither list.

