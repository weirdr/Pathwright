[package]
name = "pathwright-updater"
version = "0.1.0"
description = "Keeps the Pathwright addon up to date from its GitHub releases, from the system tray."
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
anyhow.workspace = true
dirs = "7"
png = "0.18"
rfd = "0.17"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tao = "0.37"
tray-icon = "0.25"
ureq = "3"
zip = { version = "9", default-features = false, features = ["deflate"] }

[lints]
workspace = true
