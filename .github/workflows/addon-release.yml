name: Addon release

# After each push to main that changes the addon, and every hour as a backup (GitHub's schedules
# can be late or skipped), when the addon changed since the last addon release: its smoke tests,
# then the addon zipped (scripts/addon-zip.sh: every addon folder a fresh install makes) and
# published as a GitHub release tagged Pathwright-vX.Y.Z, the commits since the last one as its
# notes. Nothing changed: no release. Run by hand, it releases now (when something changed).
# Semantic versions (scripts/addon-version.sh): each release bumps the patch number; set
# addon/VERSION to start a new minor or major version. The releases before were tagged
# addon-YYYY.MM.DD-HHMMSS. The Pathwright- prefix keeps these tags apart from release.yml's
# vX.Y.Z (the apps' releases). Each release is then announced in Discord
# (scripts/discord-release.sh) when the repository has the secret DISCORD_RELEASE_WEBHOOK; run by
# hand with "announce", it only announces the latest release again.
on:
  push:
    branches: [main]
    paths:
      - "addon/**"
      - "scripts/install-addon.sh"
      - "scripts/addon-zip.sh"
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
    inputs:
      announce:
        description: Only announce the latest release in Discord again (no release)
        type: boolean
        default: false

permissions: {}

concurrency:
  group: addon-release
  cancel-in-progress: false

jobs:
  release:
    name: Release the addon
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - name: Anything new since the last addon release?
        id: changes
        env:
          ANNOUNCE: ${{ inputs.announce }}
        run: |
          last=$(git tag --list 'Pathwright-v*' 'addon-*' --sort=-creatordate | head -n 1)
          echo "last=$last" >> "$GITHUB_OUTPUT"
          if [ "$ANNOUNCE" = true ]; then
            echo "Announcing the latest release again: no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          elif [ -n "$last" ] && git diff --quiet "$last" HEAD -- addon scripts/install-addon.sh scripts/addon-zip.sh; then
            echo "No addon change since $last: no release."
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Smoke tests
        if: steps.changes.outputs.release == 'true'
        env:
          TZ: UTC
        run: |
          sudo apt-get update
          sudo apt-get install -y luajit
          luajit addon/tests/smoke.lua
          luajit addon/tests/smoke.lua profile
      - name: Zip
        if: steps.changes.outputs.release == 'true'
        run: scripts/addon-zip.sh dist/Pathwright-addon.zip
      - name: Publish
        id: publish
        if: steps.changes.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          LAST: ${{ steps.changes.outputs.last }}
        run: |
          version=$(scripts/addon-version.sh)
          tag="Pathwright-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          guide=$(sed -n 's/^## Version: //p' addon/Pathwright_Guide/Pathwright_Guide.toc | tr -d '\r')
          profile=$(sed -n 's/^## Version: //p' addon/Pathwright_Profile/Pathwright_Profile.toc | tr -d '\r')
          {
            echo "Pathwright addon, built from main at $(git rev-parse --short HEAD)."
            echo "Guide $guide, Profile $profile. Unzip into World of Warcraft/_forever_/Interface/AddOns."
            echo
            if [ -n "$LAST" ]; then
              echo "Changes since $LAST:"
              git log --no-merges --pretty='- %s' "$LAST"..HEAD -- addon scripts/install-addon.sh scripts/addon-zip.sh
            else
              echo "First addon release."
            fi
          } > notes.md
          gh release create "$tag" dist/Pathwright-addon.zip \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "Pathwright v$version" \
            --notes-file notes.md \
            --latest
      - name: Announce in Discord
        if: steps.publish.outputs.tag != '' || inputs.announce
        # A message that fails to go out never fails the release.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_RELEASE_WEBHOOK }}
          # The release just made, else (announced again) the one marked Latest.
          TAG: ${{ steps.publish.outputs.tag }}
        run: |
          if [ -z "$DISCORD_WEBHOOK" ]; then
            echo "No DISCORD_RELEASE_WEBHOOK secret: not announced."
            exit 0
          fi
          tag=${TAG:-$(gh release view --repo "$GITHUB_REPOSITORY" --json tagName --jq .tagName)}
          scripts/discord-release.sh "$tag"
