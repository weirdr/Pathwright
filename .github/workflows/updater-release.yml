name: Updater release

# The Pathwright Updater (crates/pathwright-updater), built on GitHub's runners after each push to
# main that changes it (or run by hand) and published to one release that always holds the
# newest build: tag `updater`, titled "Pathwright Updater", never marked Latest (the addon's
# releases stay first; the updater itself only looks at addon-… tags). Its files keep their
# names, so the README links to them for good:
#   PathwrightUpdater-Windows.exe
#   PathwrightUpdater-macOS-AppleSilicon.zip   (M1 and later)
#   PathwrightUpdater-macOS-Intel.zip
on:
  push:
    branches: [main]
    paths:
      - "crates/pathwright-updater/**"
      - ".github/workflows/updater-release.yml"
  workflow_dispatch:

permissions: {}

concurrency:
  group: updater-release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: The release, at this commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/pathwright-updater/Cargo.toml | head -n 1)
          {
            echo "Pathwright Updater $version, built from main at ${GITHUB_SHA::7}: keeps the Pathwright addon up to date from this repository's releases, from the system tray (menu bar on macOS)."
            echo
            echo "| System | Download |"
            echo "|---|---|"
            echo "| Windows | PathwrightUpdater-Windows.exe |"
            echo "| macOS, Apple Silicon (M1 and later) | PathwrightUpdater-macOS-AppleSilicon.zip |"
            echo "| macOS, Intel | PathwrightUpdater-macOS-Intel.zip |"
            echo
            echo "- **Windows:** run the .exe. SmartScreen may warn about an unsigned app: More info, Run anyway."
            echo "- **macOS:** unzip, move Pathwright Updater to Applications, then right-click it and choose Open the first time (it is not notarized)."
            echo
            echo "It finds World of Warcraft by itself (or use its menu's Choose WoW folder…), checks for a new addon release every 15 minutes and installs it; the game uses it at the next /reload. It starts at login (a choice in its menu)."
          } > notes.md
          if gh release view updater --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            # The tag moves to this commit; the files are replaced by the builds below.
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/git/refs/tags/updater" -f sha="$GITHUB_SHA" -F force=true > /dev/null
            gh release edit updater --repo "$GITHUB_REPOSITORY" --title "Pathwright Updater" \
              --notes-file notes.md --latest=false
          else
            gh release create updater --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
              --title "Pathwright Updater" --notes-file notes.md --latest=false
          fi

  macos:
    name: macOS (${{ matrix.name }})
    needs: release
    runs-on: macos-latest
    permissions:
      contents: write
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            name: AppleSilicon
          - target: x86_64-apple-darwin
            name: Intel
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        env:
          TARGET: ${{ matrix.target }}
        run: |
          rustup toolchain install
          rustup target add "$TARGET"
          cargo build --release --locked -p pathwright-updater --target "$TARGET"
      - name: App bundle
        env:
          TARGET: ${{ matrix.target }}
          NAME: ${{ matrix.name }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/pathwright-updater/Cargo.toml | head -n 1)
          app="Pathwright Updater.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          cp "target/$TARGET/release/pathwright-updater" "$app/Contents/MacOS/pathwright-updater"
          cp app/src-tauri/icons/icon.icns "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Pathwright Updater</string>
            <key>CFBundleDisplayName</key><string>Pathwright Updater</string>
            <key>CFBundleIdentifier</key><string>com.pathwright.updater</string>
            <key>CFBundleExecutable</key><string>pathwright-updater</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          EOF
          plutil -lint "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" "PathwrightUpdater-macOS-$NAME.zip"
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
          NAME: ${{ matrix.name }}
        run: gh release upload updater "PathwrightUpdater-macOS-$NAME.zip" --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    name: Windows
    needs: release
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: bash
        run: |
          rustup toolchain install
          cargo build --release --locked -p pathwright-updater
          cp target/release/pathwright-updater.exe PathwrightUpdater-Windows.exe
      - name: Add to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload updater PathwrightUpdater-Windows.exe --repo "$GITHUB_REPOSITORY" --clobber
