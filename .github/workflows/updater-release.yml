name: Updater release

# The Pathwright Updater (crates/pathwright-updater): when its version changes on main, or run by
# hand, the macOS app (universal: Apple silicon and Intel) and the Windows exe are built on
# GitHub's runners and published as a release tagged updater-vX.Y.Z. It starts as a draft that
# each build adds its file to, and is published once both are there; it is never marked Latest
# (the addon's releases stay first, and the updater itself only looks at addon-… tags). A version
# already released is not built again: bump it in its Cargo.toml.
on:
  push:
    branches: [main]
    paths: ["crates/pathwright-updater/**"]
  workflow_dispatch:

permissions: {}

concurrency:
  group: updater-release
  cancel-in-progress: false

jobs:
  version:
    name: Version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      build: ${{ steps.version.outputs.build }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: New version?
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/pathwright-updater/Cargo.toml | head -n 1)
          tag="updater-v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "$tag is released already: bump the version to release again."
            echo "build=false" >> "$GITHUB_OUTPUT"
          else
            echo "build=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Draft release
        if: steps.version.outputs.build == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          {
            echo "Pathwright Updater: keeps the Pathwright addon up to date from this repository's releases, from the system tray."
            echo
            echo "- **Windows:** download PathwrightUpdater-Windows.exe and run it (SmartScreen may warn about an unsigned app: More info, Run anyway)."
            echo "- **macOS:** download PathwrightUpdater-macOS.zip, unzip it, move Pathwright Updater to Applications, then right-click it and choose Open the first time (it is not notarized)."
            echo
            echo "It finds World of Warcraft by itself (or use its menu's Choose WoW folder…), checks for a new addon release every 15 minutes and installs it; the game uses it at the next /reload. It starts at login (a choice in its menu)."
          } > notes.md
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --draft --latest=false \
            --target "$GITHUB_SHA" --title "Pathwright Updater ${TAG#updater-}" --notes-file notes.md

  macos:
    name: macOS app
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build (Apple silicon and Intel)
        run: |
          rustup toolchain install
          rustup target add aarch64-apple-darwin x86_64-apple-darwin
          cargo build --release --locked -p pathwright-updater --target aarch64-apple-darwin
          cargo build --release --locked -p pathwright-updater --target x86_64-apple-darwin
      - name: App bundle
        run: |
          version=$(sed -n 's/^version = "\(.*\)"$/\1/p' crates/pathwright-updater/Cargo.toml | head -n 1)
          app="Pathwright Updater.app"
          mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"
          lipo -create -output "$app/Contents/MacOS/pathwright-updater" \
            target/aarch64-apple-darwin/release/pathwright-updater \
            target/x86_64-apple-darwin/release/pathwright-updater
          cp app/src-tauri/icons/icon.icns "$app/Contents/Resources/AppIcon.icns"
          cat > "$app/Contents/Info.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key><string>Pathwright Updater</string>
            <key>CFBundleDisplayName</key><string>Pathwright Updater</string>
            <key>CFBundleIdentifier</key><string>com.pathwright.updater</string>
            <key>CFBundleExecutable</key><string>pathwright-updater</string>
            <key>CFBundleIconFile</key><string>AppIcon</string>
            <key>CFBundlePackageType</key><string>APPL</string>
            <key>CFBundleShortVersionString</key><string>$version</string>
            <key>CFBundleVersion</key><string>$version</string>
            <key>LSMinimumSystemVersion</key><string>11.0</string>
            <key>LSUIElement</key><true/>
          </dict>
          </plist>
          EOF
          sed -i '' 's/^          //' "$app/Contents/Info.plist"
          codesign --force --deep --sign - "$app"
          ditto -c -k --keepParent "$app" PathwrightUpdater-macOS.zip
      - name: Add to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" PathwrightUpdater-macOS.zip --repo "$GITHUB_REPOSITORY" --clobber

  windows:
    name: Windows exe
    needs: version
    if: needs.version.outputs.build == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build
        shell: bash
        run: |
          rustup toolchain install
          cargo build --release --locked -p pathwright-updater
          cp target/release/pathwright-updater.exe PathwrightUpdater-Windows.exe
      - name: Add to the release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release upload "$TAG" PathwrightUpdater-Windows.exe --repo "$GITHUB_REPOSITORY" --clobber

  publish:
    name: Publish
    needs: [version, macos, windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ needs.version.outputs.tag }}
        run: gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=false --latest=false
